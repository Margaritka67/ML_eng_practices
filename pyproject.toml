[project]
name = "bike-sharing-ml"
version = "0.1.0"
description = "Machine learning engineering project for bike-sharing demand prediction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib",
    "pandas",
    "scikit-learn",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

